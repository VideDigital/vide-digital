# Canal manual Sprint106. Functions bloqueadas até resolver dependências.
# O dry-run é uma etapa futura autorizada junto ao deploy, não read-only:
# o Firebase CLI pode habilitar APIs mesmo com --dry-run.
name: Sprint 106 — publicação controlada

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Etapa independente
        required: true
        type: choice
        options: [rules, functions]
      confirmacao:
        description: Digite PUBLICAR_RULES ou PUBLICAR_FUNCTIONS
        required: true
        type: string
      sha:
        description: SHA completo da main aprovado e autorizado
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-production-functions-deploy
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  FUNCTIONS_RELEASE_READY: "false"
  PROJECT_ID: vide-digital-saas
  S106_FUNCTIONS: functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI

jobs:
  deploy:
    name: Validar e publicar etapa nominal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validar identidade antes do checkout
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
          STAGE: ${{ inputs.stage }}
        with:
          script: |
            const sha = process.env.EXPECTED_SHA;
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') throw new Error('Somente despacho manual da main');
            const stage = process.env.STAGE;
            if (!['rules','functions'].includes(stage)) throw new Error('Etapa inválida');
            if (process.env.CONFIRMACAO !== 'PUBLICAR_' + stage.toUpperCase()) throw new Error('Confirmação inválida');
            if (stage === 'functions' && process.env.FUNCTIONS_RELEASE_READY !== 'true') throw new Error('NO-GO: consumidores WhatsApp e rollout misto ainda não resolvidos');
            core.exportVariable('TARGET_SCOPE', stage === 'rules' ? 'firestore:rules' : process.env.S106_FUNCTIONS);
            if (!/^[0-9a-f]{40}$/.test(sha || '') || context.sha !== sha) throw new Error('SHA inválido ou diferente do despacho');
            if (process.env.PROJECT_ID !== 'vide-digital-saas' || process.env.S106_FUNCTIONS !== 'functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI') throw new Error('Projeto ou escopo inválido');
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            if (data.commit.sha !== sha) throw new Error('Main avançou; autorização expirou');

      - name: Checkout do SHA autorizado
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Confirmar checkout e export
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$PROJECT_ID" = "vide-digital-saas"
          test "$S106_FUNCTIONS" = "functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI"
          grep -qE '^exports\.askBusinessAI[[:space:]]*=' functions/src/index.js


      - name: Exigir Quality Gate oficial da main no SHA exato
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const gate = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pages-qg-gate-core.mjs`).href);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id:'quality-gate.yml', branch:'main', event:'push',
              head_sha:process.env.EXPECTED_SHA, per_page:100
            });
            const selected = gate.selecionarRunAprovado(runs, {expectedSha:process.env.EXPECTED_SHA});
            if (!selected.ok) throw new Error(selected.motivo);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id:selected.run.id, filter:'latest', per_page:100
            });
            const checked = gate.validarJobsObrigatorios(jobs);
            if (!checked.ok) throw new Error(checked.motivo);
            core.info(`QG aprovado: run ${selected.run.id}, attempt ${selected.run.run_attempt}, SHA ${selected.run.head_sha}, 4/4`);

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.9.0'
      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependências fixadas
        run: pnpm install --frozen-lockfile
      - name: Verificar canal localmente
        run: node --check functions/src/index.js && node --test tests/ci/s106-minimal-release.test.mjs && pnpm run check && pnpm run test:functions

      - name: Instalar dependências Functions com lockfile
        if: inputs.stage == 'functions'
        run: pnpm install --frozen-lockfile --dir functions

      - name: Detectar autenticação existente
        id: auth-method
        shell: bash
        env:
          HAS_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_WIF_PROVIDER" == "true" && "$HAS_WIF_SA" == "true" ]]; then
            echo "method=wif" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_SA_KEY" == "true" ]]; then
            echo "method=sa-key" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum método de autenticação configurado; HARD STOP."
            exit 1
          fi

      - name: Revalidar main antes de autenticar
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            if (data.commit.sha !== process.env.EXPECTED_SHA) throw new Error('Main avançou antes da autenticação');

      - name: Autenticar via WIF
        if: steps.auth-method.outputs.method == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: vide-digital-saas
          create_credentials_file: true
          export_environment_variables: true
      - name: Autenticar via fallback existente
        if: steps.auth-method.outputs.method == 'sa-key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: vide-digital-saas
          create_credentials_file: true
          export_environment_variables: true

      - name: Revalidar main antes de qualquer operação Firebase
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            if (data.commit.sha !== process.env.EXPECTED_SHA) throw new Error('Main avançou antes do pré-flight');

      - name: Dry-run exclusivo e não interativo
        if: inputs.stage == 'functions'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          STAGE: ${{ inputs.stage }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          fail_release() { printf '::error::%s\n' "$1" >&2; exit 1; }
          [[ "${EXPECTED_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || fail_release "SHA autorizado inválido"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || fail_release "SHA do checkout divergente"
          [[ "${PROJECT_ID:-}" == "vide-digital-saas" ]] || fail_release "Projeto inválido"
          [[ "${S106_FUNCTIONS:-}" == "functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI" ]] || fail_release "Allowlist de Functions inválida"
          case "${FUNCTIONS_RELEASE_READY:-}" in
            false|true) ;;
            *) fail_release "Trava de Functions inválida" ;;
          esac
          case "${STAGE:-}" in
            rules)
              [[ "${CONFIRMACAO:-}" == "PUBLICAR_RULES" ]] || fail_release "Confirmação inválida"
              expected_scope='firestore:rules'
              ;;
            functions)
              [[ "${CONFIRMACAO:-}" == "PUBLICAR_FUNCTIONS" ]] || fail_release "Confirmação inválida"
              [[ "$FUNCTIONS_RELEASE_READY" == "true" ]] || fail_release "Functions bloqueadas"
              expected_scope='functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI'
              ;;
            *) fail_release "Etapa inválida" ;;
          esac
          # Este passo nunca pode executar uma operação de Rules, mesmo isoladamente.
          [[ "$STAGE" == "functions" ]] || fail_release "Dry-run restrito a Functions"
          [[ "${TARGET_SCOPE:-}" == "$expected_scope" ]] || fail_release "Escopo efetivo inválido"
          readonly expected_scope TARGET_SCOPE
          pnpm dlx firebase-tools@13.35.1 deploy \
            --only "${TARGET_SCOPE}" \
            --project "${PROJECT_ID}" \
            --non-interactive \
            --dry-run

      - name: Revalidar main depois do dry-run imediatamente antes do deploy
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            if (data.commit.sha !== process.env.EXPECTED_SHA) throw new Error('Main avançou; deploy bloqueado');

      - name: Publicar exclusivamente etapa autorizada
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          STAGE: ${{ inputs.stage }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          fail_release() { printf '::error::%s\n' "$1" >&2; exit 1; }
          [[ "${EXPECTED_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || fail_release "SHA autorizado inválido"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || fail_release "SHA do checkout divergente"
          [[ "${PROJECT_ID:-}" == "vide-digital-saas" ]] || fail_release "Projeto inválido"
          [[ "${S106_FUNCTIONS:-}" == "functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI" ]] || fail_release "Allowlist de Functions inválida"
          case "${FUNCTIONS_RELEASE_READY:-}" in
            false|true) ;;
            *) fail_release "Trava de Functions inválida" ;;
          esac
          case "${STAGE:-}" in
            rules)
              [[ "${CONFIRMACAO:-}" == "PUBLICAR_RULES" ]] || fail_release "Confirmação inválida"
              expected_scope='firestore:rules'
              ;;
            functions)
              [[ "${CONFIRMACAO:-}" == "PUBLICAR_FUNCTIONS" ]] || fail_release "Confirmação inválida"
              [[ "$FUNCTIONS_RELEASE_READY" == "true" ]] || fail_release "Functions bloqueadas"
              expected_scope='functions:createEmployee,functions:updateEmployee,functions:enableEmployee,functions:disableEmployee,functions:askBusinessAI'
              ;;
            *) fail_release "Etapa inválida" ;;
          esac
          [[ "${TARGET_SCOPE:-}" == "$expected_scope" ]] || fail_release "Escopo efetivo inválido"
          readonly expected_scope TARGET_SCOPE
          pnpm dlx firebase-tools@13.35.1 deploy \
            --only "${TARGET_SCOPE}" \
            --project "${PROJECT_ID}" \
            --non-interactive
