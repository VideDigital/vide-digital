# Publicação controlada do frontend no GitHub Pages.
# Nunca publica automaticamente após commit ou merge.
# A publicação exige acionamento manual, confirmação explícita
# e aprovação de todos os testes de release.

name: Publicar GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PUBLICAR para confirmar a publicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"
  JAVA_VERSION: "21"

jobs:
  validar:
    name: Validar release antes da publicação
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Bloquear publicação fora da main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A publicação de produção só pode usar a branch main."
            exit 1
          fi

      - name: Exigir confirmação explícita
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "PUBLICAR" ]; then
            echo "Confirmação inválida. Digite exatamente PUBLICAR."
            exit 1
          fi

      - name: Baixar código aprovado
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar testes completos de release
        run: pnpm run test:release

  preparar:
    name: Preparar site aprovado
    runs-on: ubuntu-latest
    needs: validar

    steps:
      - name: Baixar código aprovado sem dependências
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar pacote público do site
        shell: bash
        run: |
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.firebase/' \
            --exclude '.firebaserc*' \
            --exclude '.gitignore' \
            --exclude '.env*' \
            --exclude 'node_modules/' \
            --exclude 'firebase/' \
            --exclude 'functions/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude 'docs/' \
            --exclude 'test-results/' \
            --exclude 'package.json' \
            --exclude 'pnpm-lock.yaml' \
            --exclude 'pnpm-workspace.yaml' \
            --exclude 'firebase.json' \
            --exclude 'firestore.rules' \
            --exclude 'firestore.indexes.json' \
            --exclude 'storage.rules' \
            --exclude 'teste-*.html' \
            --exclude '*-seed.html' \
            --exclude '*.md' \
            --exclude '*-debug.log' \
            --exclude 'emulator-*.log' \
            --exclude 'gha-creds-*.json'

          touch _site/.nojekyll

      - name: Validar escopo do pacote público
        shell: bash
        run: |
          set -euo pipefail

          caminhos_proibidos=(
            "firebase"
            "functions"
            "tests"
            "scripts"
            "docs"
            ".github"
            "pnpm-workspace.yaml"
            "teste-lp-seed.html"
            "firestore.rules"
            "storage.rules"
            "firestore.indexes.json"
          )

          for caminho in "${caminhos_proibidos[@]}"; do
            if [ -e "_site/$caminho" ]; then
              echo "::error file=_site/$caminho::Arquivo operacional presente no artefato público."
              exit 1
            fi
          done

          for padrao in '.firebaserc*' '.env*' 'teste-*.html' '*-seed.html'; do
            encontrado="$(find _site -name "$padrao" -print -quit)"
            if [ -n "$encontrado" ]; then
              echo "::error file=$encontrado::Arquivo de configuração presente no artefato público."
              exit 1
            fi
          done

          arquivos_essenciais=(
            "index.html"
            "dashboard.html"
            "dashboard-app.js"
            "audit-center-v1.js"
            "audit-center-v1.css"
            "audit-core-v1.js"
            "loja.html"
            "login.html"
          )

          for arquivo in "${arquivos_essenciais[@]}"; do
            if [ ! -f "_site/$arquivo" ]; then
              echo "::error file=_site/$arquivo::Arquivo essencial ausente do artefato público."
              exit 1
            fi
          done

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  publicar:
    name: Publicar site
    runs-on: ubuntu-latest
    needs: preparar

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
