# Publicação controlada do frontend no GitHub Pages.
# Nunca publica automaticamente após commit ou merge.
# A publicação exige acionamento manual, confirmação explícita
# e aprovação de todos os testes de release.

name: Publicar GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PUBLICAR para confirmar a publicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"
  JAVA_VERSION: "21"

jobs:
  validar:
    name: Validar release antes da publicação
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Bloquear publicação fora da main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A publicação de produção só pode usar a branch main."
            exit 1
          fi

      - name: Exigir confirmação explícita
        shell: bash
        run: |
          if [ "${{ inputs.confirmacao }}" != "PUBLICAR" ]; then
            echo "Confirmação inválida. Digite exatamente PUBLICAR."
            exit 1
          fi

      - name: Baixar código aprovado
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar testes completos de release
        run: pnpm run test:release

  preparar:
    name: Preparar site aprovado
    runs-on: ubuntu-latest
    needs: validar

    steps:
      - name: Baixar código aprovado sem dependências
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  publicar:
    name: Publicar site
    runs-on: ubuntu-latest
    needs: preparar

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
