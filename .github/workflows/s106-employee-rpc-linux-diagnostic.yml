name: S106 Employee RPC Original Test Diagnostic - Temporary

on:
  push:
    branches:
      - diag/s106-employee-rpc-linux-20261023

permissions:
  contents: read

concurrency:
  group: s106-employee-rpc-linux-diagnostic
  cancel-in-progress: false

jobs:
  emulator-diagnostic:
    name: Original test A-B (Ubuntu 24.04, no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/s106-employee-rpc-linux-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-vide-hub
      GOOGLE_CLOUD_PROJECT: demo-vide-hub
    steps:
      - name: Checkout diagnostic branch without persistent credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Setup exact Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Java Temurin 21.0.12
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.12'
      - name: Verify diagnostic scope and versions before any Emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/diag/s106-employee-rpc-linux-20261023'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BASE=b1d798c157f195ed6fa654a470a383ab49c153e1
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/s106-employee-rpc-linux-diagnostic.yml|scripts/diagnostics/s106-employee-rpc-linux.mjs|scripts/diagnostics/s106-employee-rpc-postop.mjs) ;;
              *) echo "Unexpected diagnostic diff: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test "$GCLOUD_PROJECT" = demo-vide-hub
          test "$GOOGLE_CLOUD_PROJECT" = demo-vide-hub
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          test -z "${CLOUDSDK_AUTH_ACCESS_TOKEN:-}"
          test -z "${NODE_OPTIONS:-}"
          mkdir -p artifacts/s106-original
          { cat /etc/os-release; node --version; pnpm --version; java -version; git rev-parse HEAD; } > artifacts/s106-original/versions.txt 2>&1
          test "$(node --version)" = v22.23.3
          test "$(pnpm --version)" = 11.9.0
          java -version 2>&1 | grep 'version "21.0.12'
      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Record resolved Firebase versions
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec firebase --version >> artifacts/s106-original/versions.txt
          node -e "const fs=require('node:fs');const {createRequire}=require('node:module');const a=createRequire(require.resolve('firebase-admin/firestore'));console.log('firestore='+a('@google-cloud/firestore/package.json').version);console.log('admin='+JSON.parse(fs.readFileSync('node_modules/firebase-admin/package.json')).version);console.log('cli='+JSON.parse(fs.readFileSync('node_modules/firebase-tools/package.json')).version)" >> artifacts/s106-original/versions.txt
      - name: A - original unmodified with CI preceding suites
        id: original
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/s106-original/A
          set +e
          pnpm exec firebase emulators:exec --project demo-vide-hub --only firestore,storage \
            'node scripts/diagnostics/s106-employee-rpc-linux.mjs A' 2>&1 | tee artifacts/s106-original/A/console.log
          code=${PIPESTATUS[0]}
          set -e
          for file in firestore-debug.log storage-debug.log firebase-debug.log; do
            if test -f "$file"; then cp "$file" "artifacts/s106-original/A/$file"; rm -- "$file"; fi
          done
          if grep -Fq '3 INVALID_ARGUMENT: Transaction is invalid or closed.' artifacts/s106-original/A/console.log; then
            echo 'rpc3=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rpc3=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
      - name: B - original case with post-operation capture only
        id: observed
        if: ${{ !cancelled() && steps.original.outcome == 'success' && steps.original.outputs.rpc3 != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/s106-original/B
          set +e
          pnpm exec firebase emulators:exec --project demo-vide-hub --only firestore,storage \
            'node scripts/diagnostics/s106-employee-rpc-linux.mjs B' 2>&1 | tee artifacts/s106-original/B/console.log
          code=${PIPESTATUS[0]}
          set -e
          for file in firestore-debug.log storage-debug.log firebase-debug.log; do
            if test -f "$file"; then cp "$file" "artifacts/s106-original/B/$file"; rm -- "$file"; fi
          done
          exit "$code"
      - name: Archive original test and Emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s106-rpc-original-test-diagnostic-${{ github.run_id }}
          path: |
            artifacts/s106-original/
            firestore-debug.log
            storage-debug.log
            firebase-debug.log
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve phase failures without retry
        if: always()
        shell: bash
        env:
          A_OUTCOME: ${{ steps.original.outcome }}
          B_OUTCOME: ${{ steps.observed.outcome }}
        run: |
          echo "A=$A_OUTCOME B=$B_OUTCOME"
          test "$A_OUTCOME" = success && test "$B_OUTCOME" = success
