name: S106 Employee RPC Linux Diagnostic - Isolated

on:
  push:
    branches:
      - diag/s106-employee-rpc-linux-20261023

permissions:
  contents: read

concurrency:
  group: s106-employee-rpc-linux-diagnostic
  cancel-in-progress: false

jobs:
  emulator-diagnostic:
    name: Diagnostic Emulator (Ubuntu 24.04, no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/s106-employee-rpc-linux-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-vide-hub
      GOOGLE_CLOUD_PROJECT: demo-vide-hub
    steps:
      - name: Checkout diagnostic branch without persistent credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Java Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify isolated runtime and versions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/diag/s106-employee-rpc-linux-20261023'
          test "$GCLOUD_PROJECT" = 'demo-vide-hub'
          test -z "$(printenv GOOGLE_APPLICATION_CREDENTIALS || true)"
          cat /etc/os-release | grep PRETTY_NAME
          node --version
          pnpm --version
          java -version
          git rev-parse HEAD
      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Show Firebase CLI version
        run: pnpm exec firebase --version
      - name: A - isolated instrumented concurrent enable
        id: isolated
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec firebase emulators:exec --project demo-vide-hub --only firestore,storage \
            'node scripts/diagnostics/s106-employee-rpc-linux.mjs A' 2>&1 | tee s106-rpc-a.log
      - name: B - CI preceding suites, original test and instrumented trace
        id: sequence
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec firebase emulators:exec --project demo-vide-hub --only firestore,storage \
            'node scripts/diagnostics/s106-employee-rpc-linux.mjs B' 2>&1 | tee s106-rpc-b.log
      - name: Archive diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s106-rpc-linux-diagnostic-logs
          path: |
            s106-rpc-a.log
            s106-rpc-b.log
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve failures
        if: always()
        shell: bash
        env:
          A_OUTCOME: ${{ steps.isolated.outcome }}
          B_OUTCOME: ${{ steps.sequence.outcome }}
        run: |
          echo "A=$A_OUTCOME B=$B_OUTCOME"
          test "$A_OUTCOME" = success && test "$B_OUTCOME" = success
