# VIDE-HUB-OBSERVABILITY-INVENTORY-PREP-053 — inventário de observabilidade.
#
# Canal manual, auditável e SOMENTE LEITURA que descobre o estado real de
# observabilidade do projeto: Functions e serviços Cloud Run live, alert
# policies, notification channels, uptime checks, log-based metrics,
# dashboards, log sinks, contagem agregada de erros 24h, Error Reporting e
# capacidades de métrica. SOMENTE workflow_dispatch.
#
# Nada é criado, alterado ou apagado: só `gcloud ... list`, `gcloud logging
# read` (campos de recurso, sem payload) e GET na API REST de Monitoring /
# Error Reporting (lista fechada em scripts/observability-inventory-core.mjs).
# API desabilitada vira "API NOT AVAILABLE" no artefato — nunca é habilitada
# (prompts do gcloud desligados).
#
# Gates antes de autenticar (qualquer divergência falha fechado):
#   branch == main; github.sha == expected_sha == HEAD atual de main;
#   project_id e confirmação exatos (scripts/observability-inventory-cli.mjs);
#   Quality Gate push/main do expected_sha completed/success com os 4 jobs
#   (scripts/pages-qg-gate.mjs — o mesmo gate do Pages).
# Autenticação: o mesmo padrão dos workflows Firebase (WIF, fallback chave).
# Artefato `observability-inventory`: JSON por allowlist, e-mails mascarados,
# sem URL de webhook, payload de log, corpo de requisição, token ou Secret.
#
# Resultado: PASS (todas as fontes OK) ou PARTIAL (alguma fonte
# PERMISSION_DENIED / API_NOT_AVAILABLE / REST_AUTH_UNAVAILABLE /
# COMMAND_ERROR, cada uma registrada) concluem o job com SUCCESS e publicam o
# artefato — PARTIAL é diagnóstico válido, não defeito. FAIL = o job falha:
# gate, autenticação, core/CLI quebrado, JSON inválido de fonte OK ou
# invariante de sanitização violado; nesses casos não há artefato.

name: Observability Inventory — Read Only

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Projeto (exatamente vide-digital-saas)"
        required: true
        type: string
        default: vide-digital-saas
      expected_sha:
        description: "SHA completo (40 chars) do HEAD atual de main"
        required: true
        type: string
      confirm_read_only:
        description: "Digite exatamente OBSERVE_ONLY"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: vide-hub-observability-inventory
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  inventory:
    name: Observability inventory (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PROJECT_ID: ${{ inputs.project_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRMACAO: ${{ inputs.confirm_read_only }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      CLOUDSDK_CORE_SHOULD_PROMPT_TO_ENABLE_API: "false"

    steps:
      - name: Bloquear execução fora da main
        shell: bash
        run: |
          echo "WORK_DIR=${RUNNER_TEMP}/observability-inventory" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::O inventário só roda a partir da branch main."
            exit 1
          fi

      # Sem checkout ainda: prova que o SHA informado é exatamente o disparo
      # e o HEAD atual de main. process.env evita injeção via input.
      - name: Validar identidade do SHA (antes de qualquer checkout)
        id: sha
        uses: actions/github-script@v7
        with:
          script: |
            const expectedSha = process.env.EXPECTED_SHA;
            if (!/^[0-9a-f]{40}$/.test(expectedSha || "")) {
              core.setFailed("expected_sha malformado: esperado exatamente 40 caracteres hex minúsculos.");
              return;
            }
            if (context.sha !== expectedSha) {
              core.setFailed(`github.sha (${context.sha}) difere do expected_sha (${expectedSha}).`);
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: "main" });
            if (branch.commit.sha !== expectedSha) {
              core.setFailed(`main avançou: HEAD atual ${branch.commit.sha} difere do expected_sha ${expectedSha}.`);
              return;
            }
            core.info(`SHA ${expectedSha} confirmado como HEAD atual de main.`);

      - name: Checkout explícito do SHA validado
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Confirmar SHA do checkout
        id: checkout-sha
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout diverge do expected_sha."
            exit 1
          fi

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validar entradas (projeto e confirmação OBSERVE_ONLY)
        id: inputs
        run: node scripts/observability-inventory-cli.mjs inputs

      - name: Exigir Quality Gate completo (4/4) e verde no SHA exato
        id: qg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pages-qg-gate.mjs

      - name: Detectar método de autenticação disponível
        id: auth-method
        shell: bash
        env:
          HAS_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_WIF_PROVIDER}" == "true" && "${HAS_WIF_SA}" == "true" ]]; then
            echo "method=wif" >> "${GITHUB_OUTPUT}"
            echo "Método detectado: Workload Identity Federation."
          elif [[ "${HAS_SA_KEY}" == "true" ]]; then
            echo "method=sa-key" >> "${GITHUB_OUTPUT}"
            echo "Método detectado: chave de conta de serviço (FIREBASE_SERVICE_ACCOUNT)."
          else
            echo "::error::Nenhum método de autenticação configurado."
            exit 1
          fi

      - name: Autenticar via Workload Identity Federation
        id: auth-wif
        if: steps.auth-method.outputs.method == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ inputs.project_id }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Autenticar com a chave da conta de serviço
        id: auth-key
        if: steps.auth-method.outputs.method == 'sa-key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ inputs.project_id }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar gcloud
        id: setup-gcloud
        uses: google-github-actions/setup-gcloud@v2

      # CONTROLE DE FLUXO (VIDE-HUB-OBSERVABILITY-INVENTORY-FIX-057): o runner
      # executa `bash --noprofile --norc -e -o pipefail`. Cada fonte roda como
      # condição de `if` — o único ponto onde o errexit é suspenso, de forma
      # deliberada e só para aquele comando — e o exit code vai para
      # <fonte>.code. Uma fonte indisponível (IAM, API desabilitada) não
      # derruba as demais; qualquer outra falha (mkdir, node, allowlist de
      # URL) continua abortando o passo (FAIL). Sem `set +e`, sem `|| true`.
      #
      # <fonte>.json/.err ficam só em $WORK_DIR/raw: nunca impressos, nunca
      # publicados, apagados depois do build.
      - name: Coletar via gcloud (somente list/read)
        id: gcloud-collect
        shell: bash
        run: |
          set -uo pipefail
          RAW="$WORK_DIR/raw"; mkdir -p "$RAW"
          coletar() {
            local fonte="$1"; shift
            local rc
            if "$@" > "$RAW/$fonte.json" 2> "$RAW/$fonte.err"; then
              rc=0
            else
              rc=$?
            fi
            echo "$rc" > "$RAW/$fonte.code"
            echo "$fonte: exit $rc"
          }
          gcloud version | head -1
          coletar services gcloud services list --enabled --project="$PROJECT_ID" --format="json(config.name)"
          coletar functions gcloud functions list --project="$PROJECT_ID" --format=json
          coletar runServices gcloud run services list --platform=managed --project="$PROJECT_ID" --format=json
          coletar logMetrics gcloud logging metrics list --project="$PROJECT_ID" --format=json
          coletar logSinks gcloud logging sinks list --project="$PROJECT_ID" --format=json
          coletar errorLogs24h gcloud logging read 'severity>=ERROR AND (resource.type="cloud_run_revision" OR resource.type="cloud_function")' --project="$PROJECT_ID" --freshness=1d --limit=1000 --format="json(resource.type,resource.labels.service_name,resource.labels.function_name,severity)"

      # GET somente (curl sem método/corpo). Roda mesmo se o passo gcloud
      # falhar, mas SÓ se todos os gates e a autenticação passaram
      # (setup-gcloud só executa depois deles). Sem token: cada fonte REST
      # vira REST_AUTH_UNAVAILABLE, explícito. O token fica num arquivo de
      # header 0600 no RUNNER_TEMP (nunca na linha de comando), mascarado no
      # log e apagado ao final do passo.
      - name: Coletar via API REST (somente GET)
        id: rest-collect
        if: >-
          always()
          && steps.sha.outcome == 'success'
          && steps.checkout-sha.outcome == 'success'
          && steps.inputs.outcome == 'success'
          && steps.qg.outcome == 'success'
          && (steps.auth-wif.outcome == 'success' || steps.auth-key.outcome == 'success')
          && steps.setup-gcloud.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          RAW="$WORK_DIR/raw"; mkdir -p "$RAW"
          HDR="$WORK_DIR/auth-header"
          trap 'rm -f "$HDR"' EXIT
          node scripts/observability-inventory-cli.mjs rest-urls > "$WORK_DIR/rest-urls.tsv"
          TOKEN=""
          TOKEN_RC=0
          if TOKEN="$(gcloud auth print-access-token 2>/dev/null)"; then
            TOKEN_RC=0
          else
            TOKEN_RC=$?
          fi
          if [ "$TOKEN_RC" -ne 0 ] || [ -z "$TOKEN" ]; then
            echo "::warning::Access token indisponível (exit ${TOKEN_RC}) — fontes REST: REST_AUTH_UNAVAILABLE."
            while IFS=$'\t' read -r FONTE URL; do
              echo "auth:unavailable" > "$RAW/$FONTE.code"
              echo "$FONTE: REST_AUTH_UNAVAILABLE"
            done < "$WORK_DIR/rest-urls.tsv"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          ( umask 077; printf 'Authorization: Bearer %s\n' "$TOKEN" > "$HDR" )
          unset TOKEN
          while IFS=$'\t' read -r FONTE URL; do
            case "$URL" in
              https://monitoring.googleapis.com/*|https://clouderrorreporting.googleapis.com/*) ;;
              *) echo "::error::URL fora da allowlist para $FONTE"; exit 1 ;;
            esac
            CODE=""
            if CODE="$(curl -sS --max-time 60 -H @"$HDR" -o "$RAW/$FONTE.json" -w '%{http_code}' "$URL" 2> "$RAW/$FONTE.err")"; then
              echo "http:${CODE}" > "$RAW/$FONTE.code"
            else
              echo "curl:$?" > "$RAW/$FONTE.code"
            fi
            echo "$FONTE: $(cat "$RAW/$FONTE.code")"
          done < "$WORK_DIR/rest-urls.tsv"

      # Falha aqui é estrutural (core quebrado, JSON inválido de fonte OK,
      # sanitização violada): o job falha e nenhum artefato é gravado.
      - name: Montar inventário sanitizado
        id: build
        if: >-
          always()
          && steps.setup-gcloud.outcome == 'success'
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node scripts/observability-inventory-cli.mjs build "$WORK_DIR/raw" "$WORK_DIR/observability-inventory.json"
          rm -rf "$WORK_DIR/raw" "$WORK_DIR/rest-urls.tsv"

      - name: Resumo do inventário
        id: summary
        if: always()
        shell: bash
        run: |
          ARQ="$WORK_DIR/observability-inventory.json"
          if [ -f "$ARQ" ]; then
            node scripts/observability-inventory-cli.mjs summary "$ARQ"
          else
            { echo "## OBSERVABILITY INVENTORY"; echo ""; echo "**Inventory result: FAIL** — gate, autenticação ou build estrutural falhou; nenhum artefato gerado."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar artefato sanitizado (observability-inventory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-inventory
          path: ${{ runner.temp }}/observability-inventory/observability-inventory.json
          if-no-files-found: ignore
          retention-days: 90
