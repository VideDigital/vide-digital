<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vide Hub</title>
<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var caminhoRestaurado = params.get("p");
    if (caminhoRestaurado !== null) {
        var ehDominioPadrao = window.location.hostname === "videdigital.github.io";
        var base = ehDominioPadrao ? "/vide-digital/" : "/";
        params.delete("p");
        var restoQuery = params.toString();
        var novaURL = base + caminhoRestaurado + (restoQuery ? "?" + restoQuery : "") + window.location.hash;
        window.history.replaceState(null, "", novaURL);
    }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #14132B; }
    h1, h2, h3 { font-family: 'Sora', sans-serif; }
    [data-animacao] { opacity: 0; transition: opacity 0.7s ease, transform 0.7s ease; }
    [data-animacao="subir"] { transform: translateY(40px); }
    [data-animacao="esquerda"] { transform: translateX(-40px); }
    [data-animacao="direita"] { transform: translateX(40px); }
    [data-animacao="zoom"] { transform: scale(0.92); }
    [data-animacao].lp-animado { opacity: 1; transform: none; }
</style>
</head>
<body class="min-h-screen text-white">
<div id="lp-container" class="min-h-screen flex items-center justify-center">
    <p class="text-gray-400 text-sm">Carregando...</p>
</div>
<script type="module">
(async function() {
    var ehDominioPadrao = window.location.hostname === "videdigital.github.io";
    var base = ehDominioPadrao ? "/vide-digital/" : "/";

    // Import absoluto (nao relativo) -- evita quebrar quando a URL "fake" tem varios niveis (ex: /teste/lp1)
    const firebaseInit = await import(base + "firebase-init.js");
    const { doc, getDoc, getDocs, setDoc, collection, query, where, increment } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const { onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
    const { connectFunctionsEmulator, getFunctions, httpsCallable } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
    const { createLeadAttemptTracker } = await import(base + "lead-attempt-token-core.js");
    const { escapeHTML, escapeAttribute, safeLinkURL, safeImageURL, safeIframeURL } = await import(base + "lp-render-safety-core.js");
    const db = firebaseInit.db;
    const auth = firebaseInit.auth;

    // Mesmo padrão de loja.html/lp-forms-v5.js (obterCreatePublicLeadCallable):
    // getFunctions() é cacheado pelo próprio SDK, só o guard do emulador
    // precisa ser manual.
    let createPublicLeadCallable = null;
    function obterCreatePublicLeadCallable() {
        if (createPublicLeadCallable) {
            return createPublicLeadCallable;
        }
        const functionsInstance = getFunctions(firebaseInit.app, "southamerica-east1");
        if (firebaseInit.shouldUseVideEmulators() && !window.__videPublicFunctionsEmulatorConnected) {
            connectFunctionsEmulator(functionsInstance, "127.0.0.1", 5001);
            window.__videPublicFunctionsEmulatorConnected = true;
        }
        createPublicLeadCallable = httpsCallable(functionsInstance, "createPublicLead");
        return createPublicLeadCallable;
    }

    // CRM-LEAD-008 (achado 5 + achado B1-A da revisão adversarial): mesmo
    // padrão de token de tentativa opaco usado em loja.html/lp-forms-v5.js
    // — evita que createPublicLead trate um retry ambíguo como lead
    // duplicado (idempotência real) sem confundir isso com dedupe por
    // contato. Associado a um fingerprint do payload (achado B1-A): só
    // reaproveita o token quando o fingerprint da chamada atual bate com
    // o da tentativa pendente — usuário editando os dados depois de um
    // erro e reenviando sempre ganha um token novo. Estado do rastreador
    // vem de createLeadAttemptTracker (lead-attempt-token-core.js, módulo
    // puro testável via node --test — mesmo módulo usado por loja.html/
    // lp-forms-v5.js).
    const leadAttemptTrackerLP = createLeadAttemptTracker();
    // B2 (revisão adversarial final da PR #59, quarta passada —
    // serialização ambígua): campos concatenados com "|" sem escaping
    // podiam colidir se um valor comercial contivesse esse caractere
    // (mesma classe de bug corrigida em lead-attempt-token-core.js e
    // loja.html). Serializado como objeto (JSON.stringify) — cada campo
    // é uma chave própria, não uma posição delimitada por caractere.
    function fingerprintTentativaLeadPublicoLP(leadRequest) {
        const camposExtras = Object.fromEntries(Object.entries(leadRequest.camposExtras || {})
            .sort(([a], [b]) => a.localeCompare(b)));
        return JSON.stringify({
            publicPageId: leadRequest.publicPageId || "",
            formularioId: leadRequest.formularioId || "",
            nome: String(leadRequest.nome || "").trim().toLowerCase(),
            whatsapp: String(leadRequest.whatsapp || "").replace(/\D/g, ""),
            email: String(leadRequest.email || "").trim().toLowerCase(),
            camposExtras
        });
    }

    var caminho = window.location.pathname.indexOf(base) === 0 ? window.location.pathname.slice(base.length) : window.location.pathname.replace(/^\//, "");
    var segmentos = caminho.split("/").filter(Boolean);
    if (segmentos.length && segmentos[segmentos.length - 1].toLowerCase() === "index.html") {
        segmentos.pop();
    }
    var modoPreview = new URLSearchParams(window.location.search).get("preview") === "1";

    function aguardarAuth() {
        return new Promise(function(resolve) {
            const unsub = onAuthStateChanged(auth, function(user) {
                unsub();
                resolve(user);
            });
        });
    }

    async function resolverLojaPorDominio(hostname) {
        // TODO: quando o recurso de dominio proprio existir, buscar aqui
        // a loja dona desse hostname (ex: colecao "dominios_personalizados").
        return null;
    }

    // LP-SEC-AUDIT-001: existia aqui uma executarScriptsEmElemento() que
    // recriava e reinseria qualquer <script> encontrado dentro do container
    // depois de cada insertAdjacentHTML, forçando sua execução no documento
    // pai da LP pública. Nenhum tipo de bloco depende disso: codigo_iframe
    // roda seu htmlCustom dentro do próprio documento do iframe (srcdoc com
    // allow-scripts), que o navegador já executa sozinho, sem precisar de
    // recriação no documento pai; todos os outros tipos de bloco agora
    // escapam texto/atributo/URL na origem (ver lp-render-safety-core.js) e
    // nunca deveriam conter uma tag <script> de propósito. Removida: era o
    // agravante que transformava qualquer campo de texto sem escaping numa
    // execução de script garantida, mesmo fora do codigo_iframe.

    function escaparAtributoFormulario(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function renderizarCamposFormulario(campos) {
        // Unicidade GLOBAL do `name` final (não só por baseName): um label
        // que já normalize pro mesmo texto de um sufixo auto-gerado (ex.:
        // "Nome" + "Nome" + "Nome_2") não pode colidir com o `name` que o
        // segundo "Nome" recebeu — por isso o Set guarda os names FINAIS já
        // emitidos, e o sufixo é incrementado até achar um valor livre.
        const usados = new Set();
        return (Array.isArray(campos) ? campos : []).map((campo, index) => {
            const raw = typeof campo === "object" && campo
                ? (campo.id || campo.name || campo.chave || campo.label || campo.nome || "")
                : campo;
            const label = typeof campo === "object" && campo
                ? (campo.label || campo.nome || campo.name || campo.id || raw)
                : raw;
            const baseName = String(raw || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[^a-z0-9_-]+/g, "_")
                .replace(/^_+|_+$/g, "")
                .slice(0, 60) || `campo_${index + 1}`;
            let name = baseName;
            let tentativa = 1;
            while (usados.has(name)) {
                tentativa += 1;
                const suffix = `_${tentativa}`;
                name = `${baseName.slice(0, 60 - suffix.length)}${suffix}`;
            }
            usados.add(name);
            const safeName = escaparAtributoFormulario(name);
            const safeLabel = escaparAtributoFormulario(label || `Campo ${index + 1}`);
            const isWhatsapp = baseName === "whatsapp";
            return isWhatsapp
                ? `<input type="tel" name="${safeName}" inputmode="numeric" maxlength="11" placeholder="${safeLabel}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,11)" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-white">`
                : `<input type="text" name="${safeName}" placeholder="${safeLabel}" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-white">`;
        }).join("");
    }

    function camposExtrasDoFormulario(form) {
        const excluidos = new Set(["website", "nome", "name", "email", "whatsapp", "telefone", "phone"]);
        const extras = {};
        for (const [key, value] of new FormData(form).entries()) {
            if (excluidos.has(String(key).toLowerCase()) || typeof value !== "string" || !value.trim()) continue;
            extras[String(key).slice(0, 60)] = value.trim().slice(0, 500);
        }
        return extras;
    }
async function renderizarBlocosNoContainer(container, colecaoBlocos, ordemBlocos, modoLayout, paginas) {
        let blocosCarregados = [];
        for (const blocoId of ordemBlocos) {
            const blocoSnap = await getDoc(doc(db, colecaoBlocos, blocoId));
            if (blocoSnap.exists() && blocoSnap.data().visivel !== false) {
                blocosCarregados.push(blocoSnap.data());
            }
        }
        if (paginas && paginas.length > 0) {
            const paramP = parseInt(new URLSearchParams(window.location.search).get("p") || "1");
            const numeroPagina = Math.min(Math.max(1, isNaN(paramP) ? 1 : paramP), paginas.length);
            const paginaAlvo = paginas[numeroPagina - 1].id;
            blocosCarregados = blocosCarregados.filter(b => {
                const pid = b.paginaId && paginas.some(p => p.id === b.paginaId) ? b.paginaId : paginas[0].id;
                return pid === paginaAlvo;
            });
        }
        if (modoLayout === "livre") {
            const alturaCanvas = Math.max(400, ...blocosCarregados.map(b => (b.y || 20) + (b.altura || 220) + 40));
            const canvasDiv = document.createElement("div");
            canvasDiv.className = "relative";
            canvasDiv.style.height = alturaCanvas + "px";
            canvasDiv.style.width = "1440px";
            container.style.overflowX = "auto";
            container.appendChild(canvasDiv);
            for (const bloco of blocosCarregados) {
                canvasDiv.insertAdjacentHTML("beforeend", await renderizarBloco(bloco, "livre"));
            }
        } else {
            for (const bloco of blocosCarregados) {
                container.insertAdjacentHTML("beforeend", await renderizarBloco(bloco, "empilhado"));
            }
        }
ativarAnimacoesDeEntrada(container);
    }
    function ativarAnimacoesDeEntrada(container) {
        const alvos = container.querySelectorAll("[data-animacao]");
        if (alvos.length === 0) return;
        if (!("IntersectionObserver" in window)) {
            alvos.forEach(el => el.classList.add("lp-animado"));
            return;
        }
        const observador = new IntersectionObserver((entradas) => {
            entradas.forEach(entrada => {
                if (entrada.isIntersecting) {
                    entrada.target.classList.add("lp-animado");
                    observador.unobserve(entrada.target);
                }
            });
        }, { threshold: 0.15 });
        alvos.forEach(el => observador.observe(el));
    }
    // Handler de fallback: enquanto lp-forms-v5.js (carregado como módulo
    // assíncrono, ver final do arquivo) ainda não terminou de anexar seu
    // listener de submit em captura, este onsubmit inline continua sendo o
    // único caminho real pro bloco "formulario_captura" legado renderizado
    // acima. Por isso não escreve mais direto no Firestore: chama
    // createPublicLead (Cloud Function), que resolve o tenant real no
    // servidor a partir de publicPageId — visitante nunca controla
    // criadoPor. Ver functions/src/public/index.js.
    window.enviarFormularioLP = async function(event) {
        event.preventDefault();
        const form = event.target;
        const dados = {};
        form.querySelectorAll("input").forEach(inp => { dados[inp.placeholder] = inp.value.trim(); });
        const dadosNomeados = Object.fromEntries(Array.from(new FormData(form).entries())
            .filter(([, value]) => typeof value === "string")
            .map(([key, value]) => [String(key).toLowerCase(), value.trim()]));
        const nome = dadosNomeados.nome || dadosNomeados.name || dados.nome || "";
        const whatsapp = dadosNomeados.whatsapp || dadosNomeados.telefone || dadosNomeados.phone || dados.whatsapp || "";
        const email = dadosNomeados.email || dados.email || "";
        if (!nome && !whatsapp && !email) return false;
        if (!window.lpPublicPageIdAtual) {
            form.innerHTML = '<p class="text-center text-red-400 text-sm py-4">Esta página ainda não está vinculada a uma loja publicada.</p>';
            return false;
        }
        try {
            const createPublicLeadCallable = obterCreatePublicLeadCallable();
            const leadRequest = {
                publicPageId: window.lpPublicPageIdAtual,
                nome,
                whatsapp,
                telefone: whatsapp,
                email,
                origem: "Landing Page",
                produtoInteresse: document.title || "Landing Page",
                formularioId: "captura_lp_legado",
                formularioNome: "Captura pública (LP legado)",
                urlPagina: window.location.href,
                referrer: document.referrer || "",
                cliques: 0,
                camposExtras: camposExtrasDoFormulario(form)
            };
            leadRequest.dedupeKey = leadAttemptTrackerLP.getToken(fingerprintTentativaLeadPublicoLP(leadRequest));
            await createPublicLeadCallable(leadRequest);
            // Sucesso: a PRÓXIMA submissão recebe um token novo.
            leadAttemptTrackerLP.complete(fingerprintTentativaLeadPublicoLP(leadRequest));
            form.innerHTML = '<p class="text-center text-white font-bold py-4">Recebemos seus dados! Em breve entraremos em contato.</p>';
        } catch (err) {
            // Não encerra a tentativa: um retry (usuário clica de novo)
            // reaproveita o mesmo token, então uma falha ambígua (rede
            // caiu depois do servidor já ter commitado) não duplica o lead.
            console.error(err);
            form.innerHTML = '<p class="text-center text-red-400 text-sm py-4">Erro ao enviar, tenta de novo.</p>';
        }
        return false;
    };
    async function renderizarLandingPage(lojaSlug, paginaSlug) {
        const container = document.getElementById("lp-container");
        const docId = lojaSlug.toLowerCase() + "__" + paginaSlug.toLowerCase();
        try {
            const metaSnap = await getDoc(doc(db, "landing_pages_publicas", docId));
            if (!metaSnap.exists() || metaSnap.data().publicado !== true) {
                mostrarErro();
                return;
            }
            const meta = metaSnap.data();
            window.lpPublicPageIdAtual = docId;
            window.lpDonoUIDAtual = meta.donoUID || null;
            document.title = meta.titulo || "Vide Hub";
            container.className = "min-h-screen";
            container.innerHTML = "";
            // Só conta visita de página publicada de verdade (não a prévia do
            // dono) -- silencioso: uma métrica que falha não pode quebrar a
            // visita real de ninguém. Escrita direta (sem Cloud Function),
            // liberada pelas regras porque o doc é o da LP publicada real.
            const hojeMetrica = new Date().toISOString().slice(0, 10);
            // porDia como mapa aninhado de verdade (setDoc não interpreta
            // chave com ponto como caminho -- criaria um campo literal). Assim
            // o "porDia" fica sendo a única chave nova, batendo com as regras.
            setDoc(doc(db, "metricas_landing_pages", docId), {
                totalVisualizacoes: increment(1),
                porDia: { [hojeMetrica]: { visualizacoes: increment(1) } }
            }, { merge: true })
                .catch((err) => console.warn("Métrica de visita não registrada:", err?.message || err));
await renderizarBlocosNoContainer(container, "landing_pages_blocos_publicas", meta.ordemBlocos || [], meta.modoLayout || "empilhado", meta.paginas || []);
        } catch (erro) {
            console.error("Erro ao carregar landing page:", erro);
            document.getElementById("lp-container").innerHTML = '<p class="text-red-400 text-xs px-6 text-center">Erro: ' + erro.message + '</p>';
        }
    }
    async function renderizarLandingPagePreview(paginaSlug) {
        const container = document.getElementById("lp-container");
        try {
            const user = await aguardarAuth();
            if (!user) {
                container.className = "min-h-screen flex items-center justify-center";
                container.innerHTML = '<div class="text-center px-6"><p class="text-sm text-gray-300 mb-4">Voce precisa estar logado pra ver esta previa.</p><a href="login.html" class="inline-block bg-white text-black font-bold px-5 py-2.5 rounded-xl text-xs">Fazer login</a></div>';
                return;
            }
            const snap = await getDocs(query(collection(db, "landing_pages"), where("donoUID", "==", user.uid), where("pagina", "==", paginaSlug)));
            if (snap.empty) {
                mostrarErro();
                return;
            }
const lp = snap.docs[0].data();
            document.title = "[Rascunho] " + (lp.titulo || "Vide Hub");
            container.className = "min-h-screen";
            container.innerHTML = '<div class="fixed top-0 inset-x-0 z-50 bg-amber-500 text-black text-xs font-bold text-center py-1.5">RASCUNHO -- visivel so pra voce</div><div style="height:32px;"></div>';
            await renderizarBlocosNoContainer(container, "landing_pages_blocos", lp.ordemBlocos || [], lp.modoLayout || "empilhado", lp.paginas || []);
        } catch (erro) {
            console.error("Erro ao carregar previa:", erro);
            document.getElementById("lp-container").innerHTML = '<p class="text-red-400 text-xs px-6 text-center">Erro: ' + erro.message + '</p>';
        }
    }
    
    function envolverCarrossel(idUnico, slidesHtml) {
        return `
            <div class="relative">
                <div id="${idUnico}" class="flex overflow-x-auto snap-x snap-mandatory gap-4 scroll-smooth" style="scrollbar-width: none;">
                    ${slidesHtml}
                </div>
                <button onclick="document.getElementById('${idUnico}').scrollBy({left: -320, behavior: 'smooth'})" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white rounded-full w-9 h-9 flex items-center justify-center">&larr;</button>
                <button onclick="document.getElementById('${idUnico}').scrollBy({left: 320, behavior: 'smooth'})" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white rounded-full w-9 h-9 flex items-center justify-center">&rarr;</button>
            </div>
        `;
    }
    async function renderizarBloco(bloco, modoLayout) {
        const d = bloco.design || {};
        const corFundo = escapeAttribute(d.corFundo || "");
        const imagemFundo = safeImageURL(d.imagemFundoB64 || "");
        const corSobreposicao = escapeAttribute(d.corSobreposicao || "#000000");
        const opacidade = (Number(d.opacidadeSobreposicao) || 0) / 100;
        const corBotaoFundo = escapeAttribute(d.corBotaoFundo || "");
        const corBotaoBorda = escapeAttribute(d.corBotaoBorda || "");
        const corBotaoTexto = escapeAttribute(d.corBotaoTexto || "");
        const paddingTop = d.paddingTop !== undefined ? (Number(d.paddingTop) || 0) : 64;
        const paddingBottom = d.paddingBottom !== undefined ? (Number(d.paddingBottom) || 0) : 64;
        const alinhamento = d.alinhamento || "esquerda";
        const textAlignClasse = alinhamento === "centro" ? "text-center" : alinhamento === "direita" ? "text-right" : "text-left";
        const itemsClasse = alinhamento === "centro" ? "items-center" : alinhamento === "direita" ? "items-end" : "items-start";
        const justifyClasse = alinhamento === "centro" ? "justify-center" : alinhamento === "direita" ? "justify-end" : "justify-start";
        const idSecaoAttr = d.idSecao ? ` id="${escapeAttribute(String(d.idSecao).replace(/^#+/, ""))}"` : "";
        const animacaoAttr = d.animacao ? ` data-animacao="${escapeAttribute(d.animacao)}"` : "";
        const visivelDesktop = d.visivelDesktop !== false;
        const visivelMobile = d.visivelMobile !== false;
        let visClasse = "";
        if (visivelDesktop && !visivelMobile) visClasse = "hidden md:block";
        else if (!visivelDesktop && visivelMobile) visClasse = "block md:hidden";
        else if (!visivelDesktop && !visivelMobile) visClasse = "hidden";
        const loadingAttr = d.priorizarImagem ? ' loading="eager" fetchpriority="high"' : ' loading="lazy"';
        const estiloFundo = imagemFundo
            ? `background-image: url('${imagemFundo}'); background-size: cover; background-position: center;`
            : (corFundo ? `background-color: ${corFundo};` : "");
        const overlayHtml = imagemFundo
            ? `<div style="position:absolute; inset:0; background-color:${corSobreposicao}; opacity:${opacidade};"></div>`
            : "";
        const estiloBotao = `${corBotaoFundo ? "background-color:" + corBotaoFundo + ";" : ""}${corBotaoBorda ? "border: 2px solid " + corBotaoBorda + ";" : ""}${corBotaoTexto ? "color:" + corBotaoTexto + ";" : ""}`;
        const classeBotao = `inline-block font-bold px-6 py-3 rounded-xl ${!corBotaoFundo ? "bg-white" : ""} ${!corBotaoTexto ? "text-black" : ""}`;
        const classeBotaoForm = `w-full font-bold py-3 rounded-xl ${!corBotaoFundo ? "bg-white" : ""} ${!corBotaoTexto ? "text-black" : ""}`;
        let conteudoHtml = "";
        if (bloco.tipo === "texto_midia") {
            const imagemMidia = safeImageURL(bloco.props.imagemB64);
            const larguraImagem = Number(bloco.props.imagemLargura) || 0;
            conteudoHtml = `
                <div class="max-w-5xl mx-auto px-6 grid md:grid-cols-2 gap-10 ${itemsClasse}">
                    <div class="${bloco.props.posicaoImagem === "esquerda" ? "md:order-2" : ""} ${textAlignClasse}">
                        <h2 class="text-3xl font-bold mb-4">${escapeHTML(bloco.props.titulo)}</h2>
                        <p class="text-gray-300 mb-6">${escapeHTML(bloco.props.subtitulo)}</p>
                        ${bloco.props.botaoTexto ? `<a href="${escapeAttribute(safeLinkURL(bloco.props.botaoLink, { allowMailto: true, allowTel: true }))}" style="${estiloBotao}" class="${classeBotao}">${escapeHTML(bloco.props.botaoTexto)}</a>` : ""}
                    </div>
                    <div class="${bloco.props.posicaoImagem === "esquerda" ? "md:order-1" : ""}">
                        ${imagemMidia ? `<img src="${escapeAttribute(imagemMidia)}"${loadingAttr} style="${larguraImagem ? `width:${larguraImagem}px; max-width:100%;` : "width:100%;"}" class="rounded-2xl">` : ""}
                    </div>
                </div>`;
        } else if (bloco.tipo === "formulario_captura") {
            conteudoHtml = `
                <div class="max-w-md mx-auto px-6 ${textAlignClasse}">
                    <h2 class="text-2xl font-bold mb-6">${escapeHTML(bloco.props.titulo)}</h2>
                    <form class="space-y-3 text-left" onsubmit="return enviarFormularioLP(event)">
                        ${renderizarCamposFormulario(bloco.props.campos)}


                        <button type="submit" style="${estiloBotao}" class="${classeBotaoForm}">${escapeHTML(bloco.props.textoBotao || "Enviar")}</button>
                    </form>
                </div>`;
        } else if (bloco.tipo === "faq") {
            const itens = bloco.props.itens || [];
            conteudoHtml = `
                <div class="max-w-3xl mx-auto px-6 ${textAlignClasse}">
                    ${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-8">${escapeHTML(bloco.props.titulo)}</h2>` : ""}
                    <div class="space-y-3 text-left">
                        ${itens.map(item => `
                            <details class="bg-white/5 border border-white/10 rounded-xl p-4">
                                <summary class="font-bold cursor-pointer">${escapeHTML(item.pergunta)}</summary>
                                <p class="text-gray-300 mt-2 text-sm">${escapeHTML(item.resposta)}</p>
                            </details>
                        `).join("")}
                    </div>
                </div>`;
        } else if (bloco.tipo === "galeria_imagens") {
            const imagens = bloco.props.imagens || [];
            conteudoHtml = `
                <div class="max-w-5xl mx-auto px-6 ${textAlignClasse}">
                    ${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-8">${escapeHTML(bloco.props.titulo)}</h2>` : ""}
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        ${imagens.map(img => `<img src="${escapeAttribute(safeImageURL(img))}"${loadingAttr} class="w-full h-40 object-cover rounded-xl">`).join("")}
                    </div>
                </div>`;
        } else if (bloco.tipo === "lista_cards") {
            const cards = bloco.props.cards || [];
            conteudoHtml = `
                <div class="max-w-5xl mx-auto px-6 ${textAlignClasse}">
                    ${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-8">${escapeHTML(bloco.props.titulo)}</h2>` : ""}
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-left">
                        ${cards.map(card => `
                            <div class="bg-white/5 border border-white/10 rounded-xl p-5">
                                ${card.icone ? `<div class="text-2xl mb-2">${escapeHTML(card.icone)}</div>` : ""}
                                <h3 class="font-bold mb-1">${escapeHTML(card.titulo)}</h3>
                                <p class="text-gray-400 text-sm">${escapeHTML(card.texto)}</p>
                            </div>
                        `).join("")}
                    </div>
                </div>`;
        } else if (bloco.tipo === "tabela_comparativo") {
            const linhas = bloco.props.linhas || [];
            conteudoHtml = `
                <div class="max-w-3xl mx-auto px-6 ${textAlignClasse}">
                    ${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-8">${escapeHTML(bloco.props.titulo)}</h2>` : ""}
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-white/10">
                                <th class="p-3"></th>
                                <th class="p-3 font-bold">${escapeHTML(bloco.props.coluna1)}</th>
                                <th class="p-3 font-bold">${escapeHTML(bloco.props.coluna2)}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${linhas.map(linha => `
                                <tr class="border-b border-white/5">
                                    <td class="p-3 text-gray-400">${escapeHTML(linha.label)}</td>
                                    <td class="p-3">${escapeHTML(linha.valor1)}</td>
                                    <td class="p-3">${escapeHTML(linha.valor2)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>`;
        } else if (bloco.tipo === "texto_rico") {
            const paragrafos = (bloco.props.conteudo || "").split(/\n\s*\n/).filter(p => p.trim());
            conteudoHtml = `
                <div class="max-w-3xl mx-auto px-6 ${textAlignClasse}">
                    ${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-6">${escapeHTML(bloco.props.titulo)}</h2>` : ""}
                    <div class="text-gray-300 space-y-4 leading-relaxed">
                        ${paragrafos.map(p => `<p>${escapeHTML(p)}</p>`).join("")}
                    </div>
                </div>`;
        } else if (bloco.tipo === "codigo_iframe") {
            // PR61-REV2-001: srcdoc SEM sandbox herda a MESMA origem do
            // documento pai (não é opaca) — permite que o htmlCustom leia
            // window.parent.document e chame globals do pai. sandbox=
            // "allow-forms allow-popups allow-presentation allow-scripts"
            // (sem allow-same-origin, de propósito) força uma origem
            // opaca real: o HTML/script custom continua rodando dentro do
            // próprio iframe, mas fica isolado do documento pai. Mesma
            // allowlist já usada em lp-public-v4.js (implementação de
            // referência ainda não conectada a nenhuma rota ativa).
            conteudoHtml = bloco.props.htmlCustom
                ? `<div class="max-w-5xl mx-auto px-6"><iframe sandbox="allow-forms allow-popups allow-presentation allow-scripts" srcdoc="${(bloco.props.htmlCustom || "").replace(/"/g, "&quot;")}" style="width:100%; height:${Number(bloco.props.altura) || 400}px; border:0;" class="rounded-xl w-full bg-white"></iframe></div>`
                : (bloco.props.url
                    ? `<div class="max-w-5xl mx-auto px-6"><iframe src="${escapeAttribute(safeIframeURL(bloco.props.url))}" style="width:100%; height:${Number(bloco.props.altura) || 400}px; border:0;" class="rounded-xl"></iframe></div>`
                    : "");
        } else if (bloco.tipo === "carrossel_banners") {
            const banners = bloco.props.banners || [];
            const idUnico = "carrossel_" + Math.random().toString(36).slice(2);
            const slides = banners.map(b => `
                <a href="${escapeAttribute(safeLinkURL(b.link))}" class="shrink-0 snap-center w-full md:w-[600px]">
                    <img src="${escapeAttribute(safeImageURL(b.imagemB64))}"${loadingAttr} class="w-full h-64 object-cover rounded-2xl">
                </a>
            `).join("");
            conteudoHtml = `<div class="max-w-5xl mx-auto px-6">${envolverCarrossel(idUnico, slides)}</div>`;
        } else if (bloco.tipo === "carrossel_produtos") {
            const ids = bloco.props.produtosIds || [];
            const produtos = [];
            for (const pid of ids) {
                const pSnap = await getDoc(doc(db, "produtos", pid));
                if (pSnap.exists()) produtos.push(pSnap.data());
            }
            const idUnico = "carrossel_" + Math.random().toString(36).slice(2);
            const slides = produtos.map(p => `
                <div class="shrink-0 snap-center w-64 bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
                    ${p.imagemB64 ? `<img src="${escapeAttribute(safeImageURL(p.imagemB64))}"${loadingAttr} class="w-full h-40 object-cover">` : ""}
                    <div class="p-4">
                        <h3 class="font-bold text-sm mb-1">${escapeHTML(p.nome)}</h3>
                        <p class="text-gray-400 text-xs">R$ ${escapeHTML(p.preco)}</p>
                    </div>
                </div>
            `).join("");
            conteudoHtml = `<div class="max-w-5xl mx-auto px-6">${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-8 ${textAlignClasse}">${escapeHTML(bloco.props.titulo)}</h2>` : ""}${envolverCarrossel(idUnico, slides)}</div>`;
        } else if (bloco.tipo === "carrossel_cards") {
            const cards = bloco.props.cards || [];
            const idUnico = "carrossel_" + Math.random().toString(36).slice(2);
            const estilo = bloco.props.estiloImagem || "lado";
            const slides = cards.map(c => {
                const imagemCard = safeImageURL(c.imagemB64);
                if (estilo === "fundo") {
                    return `
                        <div class="shrink-0 snap-center w-64 h-72 rounded-2xl relative overflow-hidden" style="${imagemCard ? `background-image:url('${escapeAttribute(imagemCard)}');background-size:cover;background-position:center;` : "background-color:#222;"}">
                            <div class="absolute inset-0 bg-black/40"></div>
                            <div class="relative p-5 flex flex-col justify-end h-full text-white">
                                <h3 class="font-bold mb-1">${escapeHTML(c.titulo)}</h3>
                                <p class="text-sm text-gray-200">${escapeHTML(c.texto)}</p>
                            </div>
                        </div>
                    `;
                }
                return `
                    <div class="shrink-0 snap-center w-64 bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
                        ${imagemCard ? `<img src="${escapeAttribute(imagemCard)}"${loadingAttr} class="w-full h-36 object-cover">` : ""}
                        <div class="p-4">
                            <h3 class="font-bold text-sm mb-1">${escapeHTML(c.titulo)}</h3>
                            <p class="text-gray-400 text-xs">${escapeHTML(c.texto)}</p>
                        </div>
                    </div>
                `;
            }).join("");
            conteudoHtml = `<div class="max-w-5xl mx-auto px-6">${bloco.props.titulo ? `<h2 class="text-3xl font-bold mb-8 ${textAlignClasse}">${escapeHTML(bloco.props.titulo)}</h2>` : ""}${envolverCarrossel(idUnico, slides)}</div>`;
        } else if (bloco.tipo === "navegacao") {
            const links = bloco.props.links || [];
            conteudoHtml = `
                <div class="max-w-6xl mx-auto px-6 flex items-center justify-between flex-wrap gap-4">
                    <span class="font-bold text-lg">${escapeHTML(bloco.props.logoTexto)}</span>
                    <nav class="flex gap-6 flex-wrap">
                        ${links.map(l => `<a href="${escapeAttribute(safeLinkURL(l.href, { allowMailto: true, allowTel: true }))}" class="text-sm hover:opacity-70">${escapeHTML(l.label)}</a>`).join("")}
                    </nav>
                </div>`;
        } else if (bloco.tipo === "rodape") {
            const links = bloco.props.links || [];
            conteudoHtml = `
                <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-gray-400">
                    <p>${escapeHTML(bloco.props.textoCopyright)}</p>
                    <div class="flex gap-6 flex-wrap">
                        ${links.map(l => `<a href="${escapeAttribute(safeLinkURL(l.href, { allowMailto: true, allowTel: true }))}" class="hover:opacity-70">${escapeHTML(l.label)}</a>`).join("")}
                    </div>
                </div>`;
        } else if (bloco.tipo === "seletor_cores") {
            const opcoes = bloco.props.opcoes || [];
            conteudoHtml = `
                <div class="max-w-md mx-auto px-6 ${textAlignClasse}">
                    ${bloco.props.titulo ? `<h3 class="font-bold mb-3">${escapeHTML(bloco.props.titulo)}</h3>` : ""}
                    <div class="flex gap-3 flex-wrap ${justifyClasse}">
                        ${opcoes.map(op => `
                            <div class="flex flex-col items-center gap-1">
                                <div style="background-color:${escapeAttribute(op.hex || "#000")};" class="w-10 h-10 rounded-full border-2 border-white/20"></div>
                                <span class="text-[10px] text-gray-400">${escapeHTML(op.nome)}</span>
                            </div>
                        `).join("")}
                    </div>
                </div>`;
        } else if (bloco.tipo === "breadcrumb") {
            const itens = bloco.props.itens || [];
            conteudoHtml = `
                <div class="max-w-5xl mx-auto px-6 text-xs text-gray-400">
                    ${itens.map((item, idx) => `${idx > 0 ? '<span class="mx-2">/</span>' : ""}<a href="${escapeAttribute(safeLinkURL(item.href))}" class="hover:text-white">${escapeHTML(item.label)}</a>`).join("")}
                </div>`;
        } else if (bloco.tipo === "forma") {
            const largura = Number(bloco.props.largura) || 120;
            const altura = Number(bloco.props.altura) || 120;
            const corForma = escapeAttribute(bloco.props.cor || "#5B3DF5");
            let estiloForma = `width:${largura}px; background-color:${corForma};`;
            if (bloco.props.tipoForma === "circulo") estiloForma += `height:${altura}px; border-radius:50%;`;
            else if (bloco.props.tipoForma === "linha") estiloForma += `height:3px;`;
            else estiloForma += `height:${altura}px; border-radius:8px;`;
            conteudoHtml = `<div class="flex ${justifyClasse} px-6"><div style="${estiloForma}"></div></div>`;
        }
        const estiloTextoBloco = d.corTexto ? `color:${escapeAttribute(d.corTexto)};` : "";
        if (modoLayout === "livre") {
            const largura = bloco.largura || 600;
            const altura = bloco.altura || 220;
            const larguraTela = 1440;
            const x = Math.min(Math.max(0, bloco.x !== undefined ? bloco.x : 20), Math.max(0, larguraTela - largura));
            const y = bloco.y !== undefined ? bloco.y : 20;
            const zIndex = bloco.zIndex || 1;
return `<section${idSecaoAttr}${animacaoAttr} class="absolute rounded-lg overflow-hidden" style="left:${x}px; top:${y}px; width:${largura}px; height:${altura}px; z-index:${zIndex}; ${estiloFundo} ${estiloTextoBloco}">
                ${overlayHtml}
                <div class="relative w-full h-full overflow-hidden" style="padding-top:${Math.min(paddingTop, 24)}px; padding-bottom:${Math.min(paddingBottom, 24)}px;">${conteudoHtml}</div>
            </section>`;
        }
        return `<section${idSecaoAttr}${animacaoAttr} class="relative ${visClasse}" style="${estiloFundo} ${estiloTextoBloco} padding-top:${paddingTop}px; padding-bottom:${paddingBottom}px;">
            ${overlayHtml}
            <div class="relative">${conteudoHtml}</div>
        </section>`;
    }

    function mostrarErro() {
        document.getElementById("lp-container").innerHTML = '<p class="text-gray-400 text-sm">Pagina nao encontrada.</p>';
    }

    if (segmentos.length === 0) {
        window.location.href = "login.html";
    } else if (ehDominioPadrao && segmentos.length === 2 && modoPreview) {
        setTimeout(function() {
            var c = document.getElementById("lp-container");
            if (c && c.textContent.indexOf("Carregando") !== -1) {
                c.innerHTML = '<p class="text-amber-400 text-xs px-6 text-center">Travou carregando ha mais de 8s (loja=' + segmentos[0] + ', pagina=' + segmentos[1] + ')</p>';
            }
        }, 8000);
        renderizarLandingPagePreview(segmentos[1]);
    } else if (ehDominioPadrao && segmentos.length === 2) {
        setTimeout(function() {
            var c = document.getElementById("lp-container");
            if (c && c.textContent.indexOf("Carregando") !== -1) {
                c.innerHTML = '<p class="text-amber-400 text-xs px-6 text-center">Travou carregando ha mais de 8s (loja=' + segmentos[0] + ', pagina=' + segmentos[1] + ')</p>';
            }
        }, 8000);
        renderizarLandingPage(segmentos[0], segmentos[1]);
    } else if (!ehDominioPadrao && segmentos.length === 1) {
        resolverLojaPorDominio(window.location.hostname).then(function(lojaSlug) {
            if (lojaSlug) renderizarLandingPage(lojaSlug, segmentos[0]);
            else mostrarErro();
        });
    } else {
        mostrarErro();
    }
})();
</script>
<!-- Aura Forms V5 — carregamento seguro em URLs bonitas -->
<script>
(function () {
    var base = window.location.hostname === "videdigital.github.io"
        ? "/vide-digital/"
        : window.location.pathname.indexOf("/vide-digital/") === 0
            ? "/vide-digital/"
            : "/";

    if (!document.querySelector('script[data-aura-forms-v5]')) {
        var forms = document.createElement("script");
        forms.type = "module";
        forms.src = base + "lp-forms-v5.js?v=5.0.0";
        forms.setAttribute("data-aura-forms-v5", "");
        document.body.appendChild(forms);
    }
})();
</script>

</body>
</html>
